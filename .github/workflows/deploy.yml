name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-vpc
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy app to EC2 via SSM
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            eu-west-2

      # Copy the updated app code to EC2 using SSM Run Command.
      # No SSH, no open ports. SSM handles the secure connection.
      - name: Deploy app code via SSM Run Command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/app",
              "git -C /tmp/repo pull || git clone https://github.com/devgershon/aws-vpc-architecture.git /tmp/repo",
              "cp /tmp/repo/app/main.py /opt/app/main.py",
              "systemctl restart portfolio-api",
              "systemctl is-active portfolio-api"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          # Print the command output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" \
            --output text

      - name: Print live URL
        run: |
          echo "Deployment complete!"
          echo "App is live at: http://${{ secrets.ALB_DNS_NAME }}"
          echo "API docs at: http://${{ secrets.ALB_DNS_NAME }}/docs"
